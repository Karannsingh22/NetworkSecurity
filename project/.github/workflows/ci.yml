name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Install and smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify the package imports correctly
        run: |
          python -c "import networksecurity; from networksecurity.pipeline.training_pipeline import TrainingPipeline; print('Import OK')"

      - name: Run the local training pipeline
        run: |
          python main.py

      - name: Run a sample batch prediction
        run: |
          python -m networksecurity.pipeline.batch_prediction valid_data/test.csv
